<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eff3fb">
  <title>Linkroom · Linux 聊天室</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="glyph-logo" viewBox="0 0 24 24"><path d="M20 11.2a7.5 7.5 0 0 1-7.8 7.2 8.7 8.7 0 0 1-2.8-.5L5 20l.9-3.8a6.8 6.8 0 0 1-1.7-5c0-4 3.5-7.2 7.9-7.2 4.3 0 7.9 3.2 7.9 7.2Z"/><path d="M8.5 11.4h.1m3.4 0h.1m3.4 0h.1" stroke-width="2.6"/></symbol>
    <symbol id="glyph-hash" viewBox="0 0 24 24"><path d="M10 3 6 21M18 3l-4 18M4 9h16M3 15h16"/></symbol>
    <symbol id="glyph-people" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.9M15 3.2a4 4 0 0 1 0 7.6"/><circle cx="9" cy="7" r="4"/></symbol>
    <symbol id="glyph-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 2.8 6.5M3 6v6h6m3-4v4l3 2"/></symbol>
    <symbol id="glyph-file" viewBox="0 0 24 24"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10Z"/><path d="M13 3v7h7M8 15h8m-8 3h5"/></symbol>
    <symbol id="glyph-attach" viewBox="0 0 24 24"><path d="m21.4 11.5-8.7 8.7a5 5 0 0 1-7.1-7.1l9.4-9.4a3.3 3.3 0 0 1 4.7 4.7l-9.1 9.1a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></symbol>
    <symbol id="glyph-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="glyph-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="glyph-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.1M7 16.5h.1M12 7.5h5m-5 9h5"/></symbol>
    <symbol id="glyph-logout" viewBox="0 0 24 24"><path d="M10 17v3H4V4h6v3m-1 5h12m-4-4 4 4-4 4"/></symbol>
    <symbol id="glyph-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-1.5a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5V20"/></symbol>
    <symbol id="glyph-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 1 1 8 0v4m-4 4v2"/></symbol>
    <symbol id="glyph-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
    <symbol id="glyph-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16"/></symbol>
    <symbol id="glyph-settings" viewBox="0 0 24 24"><path d="m10 3-.8 2.6-2 .9-2.5-.8-2 3.4 1.9 1.8v2.2l-1.9 1.8 2 3.4 2.5-.8 2 .9.8 2.6h4l.8-2.6 2-.9 2.5.8 2-3.4-1.9-1.8v-2.2l1.9-1.8-2-3.4-2.5.8-2-.9L14 3Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="glyph-close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
    <symbol id="glyph-send" viewBox="0 0 24 24"><path d="m21 3-7.5 18-3.8-7.7L2 9.5 21 3Zm0 0L9.7 13.3"/></symbol>
  </svg>

  <main class="welcome" id="welcome">
    <div class="welcome-content">
      <div class="login-side">
        <div class="brand">
          <span class="brand-icon"><svg aria-hidden="true"><use href="#glyph-logo"/></svg></span>
          <b>Linkroom</b>
        </div>
        <form class="login" id="login-form">
          <h1 id="auth-title">登录聊天室</h1>
          <p class="auth-intro" id="auth-intro">使用你的 Linkroom 账号继续。</p>
          <div class="auth-tabs" role="group" aria-label="账号操作">
            <button type="button" id="auth-login" aria-pressed="true">登录</button>
            <button type="button" id="auth-register" aria-pressed="false">注册</button>
          </div>
          <div class="auth-fields">
            <div class="auth-field">
              <label for="username">用户名</label>
              <div class="login-input">
                <svg aria-hidden="true"><use href="#glyph-user"/></svg>
                <input id="username" name="username" type="text" placeholder="例如 alice" maxlength="31" pattern="[A-Za-z0-9_\-]{1,31}" title="使用英文字母、数字、下划线或连字符" required autocomplete="username" spellcheck="false" autocapitalize="none">
              </div>
            </div>
            <div class="auth-field" id="email-field" hidden>
              <label for="email">邮箱</label>
              <div class="login-input">
                <svg aria-hidden="true"><use href="#glyph-mail"/></svg>
                <input id="email" name="email" type="email" placeholder="name@example.com" maxlength="254" required disabled autocomplete="email" spellcheck="false" autocapitalize="none">
              </div>
            </div>
            <div class="auth-field">
              <label for="password">密码</label>
              <div class="login-input">
                <svg aria-hidden="true"><use href="#glyph-lock"/></svg>
                <input id="password" name="password" type="password" placeholder="输入密码" required autocomplete="current-password">
                <button type="button" class="password-toggle" id="toggle-password" aria-controls="password" aria-label="显示密码" aria-pressed="false">显示</button>
              </div>
            </div>
          </div>
          <button id="join" class="primary" type="submit"><span id="auth-action">进入聊天室</span><svg aria-hidden="true"><use href="#glyph-arrow"/></svg></button>
          <p id="login-error" class="error-line" role="status"></p>
        </form>
      </div>
      <div class="welcome-art" aria-hidden="true"><img src="/login-art.webp" width="960" height="960" alt=""></div>
    </div>
  </main>

  <div class="workspace" id="workspace" hidden>
    <aside class="sidebar" aria-label="聊天室导航">
      <div class="brand">
        <span class="brand-icon"><svg aria-hidden="true"><use href="#glyph-logo"/></svg></span>
        <b>Linkroom</b>
      </div>

      <nav class="navigation">
        <p class="nav-label">工作区</p>
        <button type="button" class="nav-item selected" id="nav-channel">
          <svg><use href="#glyph-hash"/></svg><span>公共聊天室</span><i class="active-mark"></i>
        </button>
        <button type="button" class="nav-item" id="nav-history">
          <svg><use href="#glyph-history"/></svg><span>最近消息</span>
        </button>
        <button type="button" class="nav-item" id="nav-files">
          <svg><use href="#glyph-file"/></svg><span>群文件</span>
        </button>
        <div id="private-nav" hidden>
          <p class="nav-label private-label">私聊</p>
          <div id="conversations"></div>
        </div>
      </nav>

      <div class="sidebar-bottom">
        <span id="identity-avatar" class="avatar identity-avatar" aria-hidden="true"><svg><use href="#glyph-user"/></svg></span>
        <div class="identity"><b id="identity-name">访客</b><small id="identity-status">尚未连接</small></div>
        <button type="button" class="icon-action" id="open-settings" aria-label="个人设置" title="个人设置" aria-haspopup="dialog"><svg aria-hidden="true"><use href="#glyph-settings"/></svg></button>
        <button type="button" class="icon-action" id="logout" aria-label="退出登录" title="退出登录" hidden><svg><use href="#glyph-logout"/></svg></button>
      </div>
    </aside>

    <main class="main">
      <header class="channel-header">
        <div class="channel-title">
          <span class="channel-icon" id="channel-icon"><svg><use href="#glyph-hash"/></svg></span>
          <div><h1 id="channel-name">公共聊天室</h1><p id="channel-description">群聊消息与共享文件</p></div>
        </div>
        <span class="connection" id="connection"><i></i><span id="connection-label">等待连接</span></span>
      </header>

      <section class="stage" aria-label="对话内容">
        <div id="messages" class="messages" role="log" aria-label="消息记录" hidden>
          <div class="empty-chat" id="empty-chat">
            <span class="empty-icon"><svg aria-hidden="true"><use href="#glyph-logo"/></svg></span>
            <p id="empty-title">还没有消息</p>
            <small id="empty-detail">发一条消息开始聊天。</small>
          </div>
          <div id="message-list"></div>
        </div>
      </section>

      <footer class="composer-area" id="composer-area" hidden>
        <div class="composer-note" id="composer-note" role="status"></div>
        <form class="composer" id="composer">
          <input type="file" id="file-picker" hidden>
          <button type="button" id="attach" class="icon-action attach" aria-label="上传群文件" title="上传群文件"><svg><use href="#glyph-attach"/></svg></button>
          <textarea id="draft" rows="1" maxlength="1024" placeholder="发送消息到公共聊天室" aria-label="消息"></textarea>
          <button id="send" type="submit" class="primary send">发送<svg><use href="#glyph-send"/></svg></button>
        </form>
      </footer>
    </main>

    <aside class="inspector" aria-label="聊天室详情">
      <section class="people-panel">
        <header class="panel-header"><span><svg><use href="#glyph-people"/></svg>在线成员</span><b id="people-count">—</b></header>
        <p class="members-placeholder" id="members-note">连接后可查看在线成员，点击成员开始私聊。</p>
        <ul id="members" class="members"></ul>
      </section>
      <section class="service-panel">
        <header class="panel-header"><span><svg><use href="#glyph-server"/></svg>服务架构</span></header>
        <ol class="service-chain" aria-label="连接路径">
          <li><i></i><div><b>网页客户端</b><small>HTTP 网关</small></div></li>
          <li><i></i><div><b>聊天服务</b><small>TCP · 多进程</small></div></li>
          <li><i></i><div><b>消息分发</b><small>System V 消息队列</small></div></li>
        </ol>
      </section>
    </aside>
  </div>
  <dialog class="settings" id="settings" aria-labelledby="settings-title" aria-describedby="settings-description">
    <form id="settings-form">
      <header class="settings-header">
        <div>
          <h2 id="settings-title">个人设置</h2>
          <p id="settings-description">应用于当前浏览器中的这个账号。</p>
        </div>
        <button type="button" class="icon-action" id="close-settings" aria-label="关闭个人设置"><svg aria-hidden="true"><use href="#glyph-close"/></svg></button>
      </header>

      <div class="settings-body">
        <section class="settings-section" aria-labelledby="profile-title">
          <h3 id="profile-title">个人资料</h3>
          <div class="settings-profile">
            <span class="avatar" id="settings-avatar" aria-hidden="true"></span>
            <div><strong id="settings-name"></strong><small id="settings-account"></small></div>
          </div>
          <div class="settings-field">
            <label for="display-name">本机显示昵称</label>
            <input type="text" id="display-name" name="displayName" maxlength="24" autocomplete="off" aria-describedby="display-name-help" autofocus>
            <small id="display-name-help">留空使用用户名。其他成员仍看到你的用户名。</small>
          </div>
          <fieldset class="avatar-options">
            <legend>头像颜色</legend>
            <label class="avatar-option"><input type="radio" name="avatarTone" value="auto"><span class="swatch auto-swatch">自动</span></label>
            <label class="avatar-option"><input type="radio" name="avatarTone" value="221" aria-label="蓝色"><span class="swatch" style="--swatch:#5274e7"></span></label>
            <label class="avatar-option"><input type="radio" name="avatarTone" value="161" aria-label="绿色"><span class="swatch" style="--swatch:#218868"></span></label>
            <label class="avatar-option"><input type="radio" name="avatarTone" value="263" aria-label="紫色"><span class="swatch" style="--swatch:#8460cb"></span></label>
            <label class="avatar-option"><input type="radio" name="avatarTone" value="12" aria-label="珊瑚色"><span class="swatch" style="--swatch:#cf674f"></span></label>
            <label class="avatar-option"><input type="radio" name="avatarTone" value="188" aria-label="青色"><span class="swatch" style="--swatch:#218397"></span></label>
          </fieldset>
        </section>

        <section class="settings-section" aria-labelledby="preferences-title">
          <h3 id="preferences-title">界面与聊天</h3>
          <div class="setting-row">
            <label for="theme">主题</label>
            <select name="theme" id="theme">
              <option value="system">跟随系统</option>
              <option value="light">浅色</option>
              <option value="dark">深色</option>
            </select>
          </div>
          <label class="setting-row setting-toggle" for="reduce-motion">
            <span>减少动效<small>关闭配图浮动和消息入场动画</small></span>
            <input type="checkbox" name="reduceMotion" id="reduce-motion">
          </label>
          <label class="setting-row setting-toggle" for="enter-sends">
            <span>按 Enter 发送<small>关闭后，使用发送按钮提交</small></span>
            <input type="checkbox" name="enterSends" id="enter-sends">
          </label>
        </section>
      </div>

      <footer class="settings-footer">
        <p class="settings-feedback" id="settings-feedback" role="alert" hidden></p>
        <button type="button" class="secondary" id="cancel-settings">取消</button>
        <button type="submit" class="primary">保存设置</button>
      </footer>
    </form>
  </dialog>
</body>
</html>
